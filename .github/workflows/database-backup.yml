name: Backup do banco

on:
  schedule:
    - cron: "30 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    name: Exportar e proteger dados
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      BACKUP_PASSWORD: ${{ secrets.BACKUP_ENCRYPTION_PASSWORD }}

    steps:
      - name: Verificar configuração
        shell: bash
        run: |
          if [ -n "$DATABASE_URL" ] && [ -n "$BACKUP_PASSWORD" ]; then
            exit 0
          fi

          echo "::error::Backup não realizado. Configure NEON_DATABASE_URL e BACKUP_ENCRYPTION_PASSWORD nos secrets do repositório."
          exit 1

      - name: Exportar PostgreSQL
        shell: bash
        run: |
          mkdir -p backup
          docker run --rm \
            -e DATABASE_URL \
            postgres:17-alpine \
            sh -c 'pg_dump "$DATABASE_URL" --format=custom --no-owner --no-acl' \
            > backup/agrogestor.dump
          test -s backup/agrogestor.dump

      - name: Verificar restauração em banco temporário
        shell: bash
        run: |
          export POSTGRES_PASSWORD="$(openssl rand -hex 32)"
          docker run --detach --name backup-validation \
            -e POSTGRES_PASSWORD postgres:17-alpine
          for attempt in $(seq 1 30); do
            if docker exec backup-validation pg_isready -U postgres; then
              break
            fi
            sleep 1
          done
          docker exec backup-validation pg_isready -U postgres
          docker exec -i backup-validation \
            pg_restore --exit-on-error --no-owner --no-acl \
            --username=postgres --dbname=postgres < backup/agrogestor.dump

      - name: Criptografar e verificar backup
        shell: bash
        run: |
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 \
            -in backup/agrogestor.dump \
            -out backup/agrogestor.dump.enc \
            -pass env:BACKUP_PASSWORD
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -in backup/agrogestor.dump.enc \
            -out backup/restored.dump \
            -pass env:BACKUP_PASSWORD
          cmp backup/agrogestor.dump backup/restored.dump
          rm backup/agrogestor.dump backup/restored.dump
          sha256sum backup/agrogestor.dump.enc > backup/checksums.sha256
          test -s backup/agrogestor.dump.enc

      - name: Guardar backup por 30 dias
        uses: actions/upload-artifact@v4
        with:
          name: agrogestor-dados-${{ github.run_id }}
          path: |
            backup/agrogestor.dump.enc
            backup/checksums.sha256
          retention-days: 30
          if-no-files-found: error

      - name: Remover ambiente temporário
        if: always()
        shell: bash
        run: |
          docker rm --force backup-validation >/dev/null 2>&1 || true
          rm -f backup/agrogestor.dump backup/restored.dump
